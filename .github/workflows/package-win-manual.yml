name: Package Windows (Manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag, or SHA). Leave empty for current default ref.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  package-windows:
    name: Package Windows (${{ matrix.brand }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        brand:
          - huanxingclaw
          - deepclaw
          - fengchiclaw
          - frogclaw

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Prefer HTTPS for public GitHub git dependencies
        run: |
          git config --global "url.https://github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://github.com/.insteadOf" "ssh://git@github.com/"

      - name: Install dependencies
        run: pnpm install

      - name: Download uv binaries for Windows
        run: pnpm run uv:download:win

      - name: Download agent-browser binaries for Windows
        run: pnpm run agent-browser:download:win

      - name: Download Node.js binaries for Windows
        run: pnpm run node:download:win

      - name: Build Windows package (no publish)
        env:
          BRAND: ${{ matrix.brand }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm run package
          node scripts/run-electron-builder.mjs --win --publish never --config.directories.output=release/${{ matrix.brand }}

      - name: Upload Windows Installer (x64)
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ matrix.brand }}-x64
          path: release/${{ matrix.brand }}/*-win-x64.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows Installer (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ matrix.brand }}-arm64
          path: release/${{ matrix.brand }}/*-win-arm64.exe
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Windows Blockmap Files
        uses: actions/upload-artifact@v4
        with:
          name: windows-blockmap-${{ matrix.brand }}
          path: release/${{ matrix.brand }}/*.blockmap
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Windows Update Manifests
        uses: actions/upload-artifact@v4
        with:
          name: windows-update-manifests-${{ matrix.brand }}
          path: |
            release/${{ matrix.brand }}/*.yml
            !release/${{ matrix.brand }}/builder-debug.yml
          if-no-files-found: warn
          retention-days: 7
