name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.4.9). Must match package.json.'
        required: true
      remote_path:
        description: 'Linux server download root. Use /www/wwwroot/downloads, or leave empty to use LINUX_DEPLOY_PATH.'
        required: false
        default: ''

permissions:
  contents: write

env:
  SERVICE_URL: https://ai.fengchiyun.com
  UPDATE_FEED_BASE_URL: https://ai.fengchiyun.com/downloads

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Assert release version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            node scripts/assert-tag-matches-package.mjs
          else
            PACKAGE_VERSION="$(node -p "require('./package.json').version")"
            INPUT_VERSION="${{ inputs.version }}"
            if [[ "$PACKAGE_VERSION" != "$INPUT_VERSION" ]]; then
              echo "workflow_dispatch version ($INPUT_VERSION) must match package.json version ($PACKAGE_VERSION)."
              exit 1
            fi
            echo "OK: workflow_dispatch version $INPUT_VERSION matches package.json."
          fi

  release-windows:
    name: Release Windows (${{ matrix.brand }})
    needs: validate-release
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        brand:
          - huanxingclaw
          - fengchiclaw
          - frogclaw

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Show runner disk space
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

      - name: Prefer HTTPS for public GitHub git dependencies
        run: |
          git config --global "url.https://github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://github.com/.insteadOf" "ssh://git@github.com/"

      - name: Install dependencies
        run: pnpm install

      - name: Download uv binaries for Windows
        run: pnpm run uv:download:win

      - name: Download agent-browser binaries for Windows
        run: pnpm run agent-browser:download:win

      - name: Download Node.js binaries for Windows
        run: pnpm run node:download:win

      - name: Configure brand domain for release
        env:
          BRAND: ${{ matrix.brand }}
        shell: pwsh
        run: |
          $brandFile = "brands/$env:BRAND.json"
          $brand = Get-Content $brandFile -Raw | ConvertFrom-Json
          $serviceUrl = $env:SERVICE_URL.TrimEnd('/')
          $updateFeedBaseUrl = $env:UPDATE_FEED_BASE_URL.TrimEnd('/')

          $brand.serviceUrl = "$serviceUrl/"
          $brand.updateFeedBaseUrl = "$updateFeedBaseUrl/$env:BRAND"

          $brand | ConvertTo-Json -Depth 20 | Set-Content $brandFile -Encoding utf8
          Write-Host "Configured $env:BRAND serviceUrl=$($brand.serviceUrl)"
          Write-Host "Configured $env:BRAND updateFeedBaseUrl=$($brand.updateFeedBaseUrl)"

      - name: Generate brand and extension bridge
        env:
          BRAND: ${{ matrix.brand }}
        run: node scripts/generate-brand.mjs && node scripts/generate-ext-bridge.mjs

      - name: Build Vite bundles
        env:
          BRAND: ${{ matrix.brand }}
        run: pnpm run build:vite

      - name: Verify generated brand
        env:
          BRAND: ${{ matrix.brand }}
        shell: pwsh
        run: |
          $activeBrand = Get-Content shared/brand/active.generated.ts -Raw
          $expected = "id: '$env:BRAND'"
          if (!$activeBrand.Contains($expected)) {
            throw "Generated active brand does not match matrix brand. Expected $expected in shared/brand/active.generated.ts."
          }
          Write-Host "Verified generated active brand: $env:BRAND"

      - name: Generate brand package icons
        env:
          BRAND: ${{ matrix.brand }}
        run: pnpm run icons

      - name: Bundle OpenClaw runtime
        run: pnpm exec zx scripts/bundle-openclaw.mjs

      - name: Bundle OpenClaw plugins
        run: pnpm exec zx scripts/bundle-openclaw-plugins.mjs

      - name: Verify committed preinstalled skills
        shell: pwsh
        run: |
          if (!(Test-Path build/preinstalled-skills/.preinstalled-lock.json)) {
            throw "Missing committed build/preinstalled-skills/.preinstalled-lock.json. Run pnpm exec zx scripts/bundle-preinstalled-skills.mjs and commit build/preinstalled-skills."
          }

          $skills = Get-ChildItem build/preinstalled-skills -Directory
          if ($skills.Count -eq 0) {
            throw "No committed preinstalled skills found under build/preinstalled-skills."
          }

          $skills | Select-Object Name

      - name: Build Windows package (no publish)
        env:
          BRAND: ${{ matrix.brand }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/run-electron-builder.mjs --win --publish never --config.directories.output=release/${{ matrix.brand }}

      - name: Prepare Linux upload payload
        id: upload_payload
        env:
          BRAND: ${{ matrix.brand }}
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$package.version
          $channel = 'latest'
          if ($version -match '-([A-Za-z]+)') {
            $channel = $Matches[1]
          }

          $source = "release/$env:BRAND"
          $channelOut = "release-upload/$env:BRAND/$channel"
          $archiveOut = "release-upload/$env:BRAND/releases/v$version"

          New-Item -ItemType Directory -Force -Path $channelOut, $archiveOut | Out-Null

          Get-ChildItem $source -File |
            Where-Object { $_.Name -ne 'builder-debug.yml' } |
            ForEach-Object {
              Copy-Item $_.FullName -Destination $channelOut -Force
              Copy-Item $_.FullName -Destination $archiveOut -Force
            }

          $expectedYml = if ($channel -eq 'latest') { 'latest.yml' } else { "$channel.yml" }
          $expectedPath = Join-Path $channelOut $expectedYml
          $latestPath = Join-Path $channelOut 'latest.yml'
          if (!(Test-Path $expectedPath) -and (Test-Path $latestPath)) {
            Copy-Item $latestPath -Destination $expectedPath -Force
          }

          Write-Host "version=$version"
          Write-Host "channel=$channel"
          Write-Host "upload_dir=$channelOut"
          Get-ChildItem $channelOut | Select-Object Name, Length

          "version=$version" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "channel_dir=$channelOut" >> $env:GITHUB_OUTPUT
          "archive_dir=$archiveOut" >> $env:GITHUB_OUTPUT

      - name: Publish package to GitHub Release
        env:
          BRAND: ${{ matrix.brand }}
          CHANNEL_DIR: ${{ steps.upload_payload.outputs.channel_dir }}
          VERSION: ${{ steps.upload_payload.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          if (!(Get-Command gh -ErrorAction SilentlyContinue)) {
            throw "GitHub CLI (gh) is not available on this runner."
          }

          $repo = $env:GITHUB_REPOSITORY
          $tag = "v$env:VERSION"
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $notes = "Release assets generated by workflow run $runUrl"

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo $repo `
              --target $env:GITHUB_SHA `
              --title "Release $tag" `
              --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "Failed to create GitHub Release $tag" }
          }

          $releaseOut = "github-release-upload/$env:BRAND"
          New-Item -ItemType Directory -Force -Path $releaseOut | Out-Null

          Get-ChildItem $env:CHANNEL_DIR -File |
            Where-Object { $_.Name -ne 'builder-debug.yml' } |
            ForEach-Object {
              $assetName = $_.Name
              if ($_.Extension -eq '.yml') {
                $assetName = "$env:BRAND-$assetName"
              }
              Copy-Item $_.FullName -Destination (Join-Path $releaseOut $assetName) -Force
            }

          $files = Get-ChildItem $releaseOut -File | ForEach-Object { $_.FullName }

          if ($files.Count -eq 0) {
            throw "No release files found under $env:CHANNEL_DIR"
          }

          gh release upload $tag @files --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload GitHub Release assets for $env:BRAND" }

          Write-Host "Uploaded $env:BRAND release assets to https://github.com/$repo/releases/tag/$tag"

      - name: Configure SSH for Linux upload
        env:
          SECRET_LINUX_DEPLOY_HOST: ${{ secrets.LINUX_DEPLOY_HOST }}
          SECRET_LINUX_DEPLOY_PORT: ${{ secrets.LINUX_DEPLOY_PORT }}
          SECRET_LINUX_DEPLOY_USER: ${{ secrets.LINUX_DEPLOY_USER }}
          VAR_LINUX_DEPLOY_HOST: ${{ vars.LINUX_DEPLOY_HOST }}
          VAR_LINUX_DEPLOY_PORT: ${{ vars.LINUX_DEPLOY_PORT }}
          VAR_LINUX_DEPLOY_USER: ${{ vars.LINUX_DEPLOY_USER }}
          LINUX_DEPLOY_KEY: ${{ secrets.LINUX_DEPLOY_KEY }}
          LINUX_DEPLOY_KNOWN_HOSTS: ${{ secrets.LINUX_DEPLOY_KNOWN_HOSTS }}
          SECRET_LINUX_DEPLOY_PATH: ${{ secrets.LINUX_DEPLOY_PATH }}
          VAR_LINUX_DEPLOY_PATH: ${{ vars.LINUX_DEPLOY_PATH }}
          INPUT_REMOTE_PATH: ${{ inputs.remote_path }}
        shell: pwsh
        run: |
          $deployHost = if ([string]::IsNullOrWhiteSpace($env:SECRET_LINUX_DEPLOY_HOST)) { $env:VAR_LINUX_DEPLOY_HOST } else { $env:SECRET_LINUX_DEPLOY_HOST }
          $deployPort = if ([string]::IsNullOrWhiteSpace($env:SECRET_LINUX_DEPLOY_PORT)) { $env:VAR_LINUX_DEPLOY_PORT } else { $env:SECRET_LINUX_DEPLOY_PORT }
          $deployUser = if ([string]::IsNullOrWhiteSpace($env:SECRET_LINUX_DEPLOY_USER)) { $env:VAR_LINUX_DEPLOY_USER } else { $env:SECRET_LINUX_DEPLOY_USER }
          $configuredRemotePath = if ([string]::IsNullOrWhiteSpace($env:SECRET_LINUX_DEPLOY_PATH)) { $env:VAR_LINUX_DEPLOY_PATH } else { $env:SECRET_LINUX_DEPLOY_PATH }

          if ([string]::IsNullOrWhiteSpace($deployHost)) { $deployHost = '43.224.248.112' }
          if ([string]::IsNullOrWhiteSpace($deployUser)) { $deployUser = 'root' }

          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:LINUX_DEPLOY_KEY)) { $missing += 'secrets.LINUX_DEPLOY_KEY' }
          if ([string]::IsNullOrWhiteSpace($env:INPUT_REMOTE_PATH) -and [string]::IsNullOrWhiteSpace($configuredRemotePath)) {
            $missing += 'workflow input remote_path, secrets.LINUX_DEPLOY_PATH, or vars.LINUX_DEPLOY_PATH'
          }
          if ($missing.Count -gt 0) {
            throw "Missing Linux upload configuration: $($missing -join ', ')"
          }

          $port = if ([string]::IsNullOrWhiteSpace($deployPort)) { '22' } else { $deployPort }
          $remotePath = if ([string]::IsNullOrWhiteSpace($env:INPUT_REMOTE_PATH)) { $configuredRemotePath } else { $env:INPUT_REMOTE_PATH }
          $remotePath = $remotePath.TrimEnd('/')

          $sshDir = Join-Path $HOME '.ssh'
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null

          $keyPath = Join-Path $sshDir 'linux_deploy_key'
          ($env:LINUX_DEPLOY_KEY -replace "`r`n", "`n") | Set-Content -Path $keyPath -NoNewline -Encoding ascii
          icacls $keyPath /grant:r "$($env:USERNAME):F" | Out-Null

          $knownHostsPath = Join-Path $sshDir 'known_hosts'
          if ([string]::IsNullOrWhiteSpace($env:LINUX_DEPLOY_KNOWN_HOSTS)) {
            New-Item -ItemType File -Force -Path $knownHostsPath | Out-Null
            $strictHostKeyChecking = 'accept-new'
          } else {
            ($env:LINUX_DEPLOY_KNOWN_HOSTS -replace "`r`n", "`n") | Set-Content -Path $knownHostsPath -NoNewline -Encoding ascii
            $strictHostKeyChecking = 'yes'
          }

          "SSH_KEY_PATH=$keyPath" >> $env:GITHUB_ENV
          "SSH_KNOWN_HOSTS_PATH=$knownHostsPath" >> $env:GITHUB_ENV
          "SSH_STRICT_HOST_KEY_CHECKING=$strictHostKeyChecking" >> $env:GITHUB_ENV
          "LINUX_DEPLOY_HOST=$deployHost" >> $env:GITHUB_ENV
          "LINUX_DEPLOY_PORT=$port" >> $env:GITHUB_ENV
          "LINUX_DEPLOY_USER=$deployUser" >> $env:GITHUB_ENV
          "LINUX_DEPLOY_REMOTE_PATH=$remotePath" >> $env:GITHUB_ENV

      - name: Upload package to Linux server
        env:
          BRAND: ${{ matrix.brand }}
          CHANNEL: ${{ steps.upload_payload.outputs.channel }}
          VERSION: ${{ steps.upload_payload.outputs.version }}
          CHANNEL_DIR: ${{ steps.upload_payload.outputs.channel_dir }}
          ARCHIVE_DIR: ${{ steps.upload_payload.outputs.archive_dir }}
        shell: pwsh
        run: ./.github/scripts/upload-release-to-linux.ps1

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ matrix.brand }}-x64
          path: release/${{ matrix.brand }}/*-win-x64.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows Blockmap Files
        uses: actions/upload-artifact@v4
        with:
          name: windows-blockmap-${{ matrix.brand }}
          path: release/${{ matrix.brand }}/*.blockmap
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Windows Update Manifests
        uses: actions/upload-artifact@v4
        with:
          name: windows-update-manifests-${{ matrix.brand }}
          path: |
            release/${{ matrix.brand }}/*.yml
            !release/${{ matrix.brand }}/builder-debug.yml
          if-no-files-found: warn
          retention-days: 7

  release-macos:
    name: Release macOS (${{ matrix.brand }})
    needs:
      - validate-release
    runs-on: macos-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        brand:
          - huanxingclaw
          - fengchiclaw
          - frogclaw

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Show runner disk space
        shell: bash
        run: |
          df -h

      - name: Prefer HTTPS for public GitHub git dependencies
        run: |
          git config --global "url.https://github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://github.com/.insteadOf" "ssh://git@github.com/"

      - name: Install dependencies
        run: pnpm install

      - name: Download uv binaries for macOS
        run: pnpm run uv:download:mac

      - name: Download agent-browser binaries for macOS
        run: pnpm run agent-browser:download:mac

      - name: Configure brand domain for release
        env:
          BRAND: ${{ matrix.brand }}
        shell: pwsh
        run: |
          $brandFile = "brands/$env:BRAND.json"
          $brand = Get-Content $brandFile -Raw | ConvertFrom-Json
          $serviceUrl = $env:SERVICE_URL.TrimEnd('/')
          $updateFeedBaseUrl = $env:UPDATE_FEED_BASE_URL.TrimEnd('/')

          $brand.serviceUrl = "$serviceUrl/"
          $brand.updateFeedBaseUrl = "$updateFeedBaseUrl/$env:BRAND"

          $brand | ConvertTo-Json -Depth 20 | Set-Content $brandFile -Encoding utf8
          Write-Host "Configured $env:BRAND serviceUrl=$($brand.serviceUrl)"
          Write-Host "Configured $env:BRAND updateFeedBaseUrl=$($brand.updateFeedBaseUrl)"

      - name: Generate brand and extension bridge
        env:
          BRAND: ${{ matrix.brand }}
        run: node scripts/generate-brand.mjs && node scripts/generate-ext-bridge.mjs

      - name: Build Vite bundles
        env:
          BRAND: ${{ matrix.brand }}
        run: pnpm run build:vite

      - name: Verify generated brand
        env:
          BRAND: ${{ matrix.brand }}
        shell: pwsh
        run: |
          $activeBrand = Get-Content shared/brand/active.generated.ts -Raw
          $expected = "id: '$env:BRAND'"
          if (!$activeBrand.Contains($expected)) {
            throw "Generated active brand does not match matrix brand. Expected $expected in shared/brand/active.generated.ts."
          }
          Write-Host "Verified generated active brand: $env:BRAND"

      - name: Generate brand package icons
        env:
          BRAND: ${{ matrix.brand }}
        run: pnpm run icons

      - name: Bundle OpenClaw runtime
        run: pnpm exec zx scripts/bundle-openclaw.mjs

      - name: Bundle OpenClaw plugins
        run: pnpm exec zx scripts/bundle-openclaw-plugins.mjs

      - name: Verify committed preinstalled skills
        shell: pwsh
        run: |
          if (!(Test-Path build/preinstalled-skills/.preinstalled-lock.json)) {
            throw "Missing committed build/preinstalled-skills/.preinstalled-lock.json. Run pnpm exec zx scripts/bundle-preinstalled-skills.mjs and commit build/preinstalled-skills."
          }

          $skills = Get-ChildItem build/preinstalled-skills -Directory
          if ($skills.Count -eq 0) {
            throw "No committed preinstalled skills found under build/preinstalled-skills."
          }

          $skills | Select-Object Name

      - name: Build macOS package (no publish)
        env:
          BRAND: ${{ matrix.brand }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK || secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.MAC_CSC_NAME || secrets.CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          build_args=(--mac --publish never --config.directories.output="release/${BRAND}")

          has_signing_identity=true
          has_valid_csc_link=false
          if [[ -z "${CSC_LINK}" ]]; then
            unset CSC_LINK
          else
            csc_link_compact="$(printf '%s' "${CSC_LINK}" | tr -d '[:space:]')"
            if [[ "${CSC_LINK}" == file://* ]]; then
              csc_link_file="${CSC_LINK#file://}"
              if [[ -f "${csc_link_file}" ]]; then
                has_valid_csc_link=true
              else
                echo "macOS CSC_LINK file:// target is not a certificate file; ignoring it."
                unset CSC_LINK
              fi
            elif [[ "${CSC_LINK}" == http://* || "${CSC_LINK}" == https://* || "${CSC_LINK}" == data:* ]]; then
              has_valid_csc_link=true
            elif [[ ${#csc_link_compact} -gt 100 && "${csc_link_compact}" =~ ^[A-Za-z0-9+/=_-]+$ ]]; then
              export CSC_LINK="${csc_link_compact}"
              has_valid_csc_link=true
            elif [[ -f "${CSC_LINK}" ]]; then
              has_valid_csc_link=true
            else
              echo "macOS CSC_LINK is set but is not a certificate file, URL, file:// URL, data URL, or base64 payload; ignoring it."
              unset CSC_LINK
            fi
          fi

          if [[ "${has_valid_csc_link}" != "true" ]]; then
            has_signing_identity=false
            unset CSC_LINK CSC_NAME CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "macOS signing certificate is not configured; building unsigned."
          elif [[ -z "${CSC_KEY_PASSWORD}" ]]; then
            has_signing_identity=false
            unset CSC_LINK CSC_NAME CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "macOS signing identity is incomplete (missing CSC_KEY_PASSWORD); building unsigned."
          fi

          if [[ "${has_signing_identity}" == "true" && -n "${CSC_NAME}" ]]; then
            csc_name_normalized="$(printf '%s' "${CSC_NAME}" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')"
            if [[ "${csc_name_normalized}" == Developer\ ID\ Application:* ]]; then
              csc_name_normalized="${csc_name_normalized#Developer ID Application:}"
              csc_name_normalized="$(printf '%s' "${csc_name_normalized}" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')"
              echo "Removed Developer ID Application prefix from macOS CSC_NAME."
            fi
            if [[ -n "${csc_name_normalized}" ]]; then
              export CSC_NAME="${csc_name_normalized}"
            else
              unset CSC_NAME
            fi
          fi

          has_apple_password_notary=false
          if [[ -n "${APPLE_ID}" && -n "${APPLE_APP_SPECIFIC_PASSWORD}" && -n "${APPLE_TEAM_ID}" ]]; then
            has_apple_password_notary=true
          fi

          has_apple_api_notary=false
          if [[ -n "${APPLE_API_KEY}" && -n "${APPLE_API_KEY_ID}" && -n "${APPLE_API_ISSUER}" ]]; then
            has_apple_api_notary=true
          fi

          has_notary_config=false
          if [[ "${has_apple_password_notary}" == "true" || "${has_apple_api_notary}" == "true" ]]; then
            has_notary_config=true
          fi

          if [[ "${has_signing_identity}" != "true" ]]; then
            build_args+=(--config.mac.identity=null)
          fi

          if [[ "${has_signing_identity}" != "true" || "${has_notary_config}" != "true" ]]; then
            build_args+=(--config.mac.notarize=false)
            echo "macOS signing or notarization is not fully configured; building without notarization."
          fi

          node scripts/run-electron-builder.mjs "${build_args[@]}"

      - name: Prepare Linux upload payload
        id: upload_payload
        env:
          BRAND: ${{ matrix.brand }}
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$package.version
          $channel = 'latest'
          if ($version -match '-([A-Za-z]+)') {
            $channel = $Matches[1]
          }

          $source = "release/$env:BRAND"
          $channelOut = "release-upload/$env:BRAND/$channel"
          $archiveOut = "release-upload/$env:BRAND/releases/v$version"

          New-Item -ItemType Directory -Force -Path $channelOut, $archiveOut | Out-Null

          Get-ChildItem $source -File |
            Where-Object { $_.Name -ne 'builder-debug.yml' } |
            ForEach-Object {
              Copy-Item $_.FullName -Destination $channelOut -Force
              Copy-Item $_.FullName -Destination $archiveOut -Force
            }

          $expectedYml = if ($channel -eq 'latest') { 'latest-mac.yml' } else { "$channel-mac.yml" }
          $expectedPath = Join-Path $channelOut $expectedYml
          $latestPath = Join-Path $channelOut 'latest-mac.yml'
          if (!(Test-Path $expectedPath) -and (Test-Path $latestPath)) {
            Copy-Item $latestPath -Destination $expectedPath -Force
          }

          Write-Host "version=$version"
          Write-Host "channel=$channel"
          Write-Host "upload_dir=$channelOut"
          Get-ChildItem $channelOut | Select-Object Name, Length

          "version=$version" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "channel_dir=$channelOut" >> $env:GITHUB_OUTPUT
          "archive_dir=$archiveOut" >> $env:GITHUB_OUTPUT

      - name: Publish package to GitHub Release
        env:
          BRAND: ${{ matrix.brand }}
          CHANNEL_DIR: ${{ steps.upload_payload.outputs.channel_dir }}
          VERSION: ${{ steps.upload_payload.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          if (!(Get-Command gh -ErrorAction SilentlyContinue)) {
            throw "GitHub CLI (gh) is not available on this runner."
          }

          $repo = $env:GITHUB_REPOSITORY
          $tag = "v$env:VERSION"
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $notes = "Release assets generated by workflow run $runUrl"

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo $repo `
              --target $env:GITHUB_SHA `
              --title "Release $tag" `
              --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "Failed to create GitHub Release $tag" }
          }

          $releaseOut = "github-release-upload/$env:BRAND"
          New-Item -ItemType Directory -Force -Path $releaseOut | Out-Null

          Get-ChildItem $env:CHANNEL_DIR -File |
            Where-Object { $_.Name -ne 'builder-debug.yml' } |
            ForEach-Object {
              $assetName = $_.Name
              if ($_.Extension -eq '.yml') {
                $assetName = "$env:BRAND-$assetName"
              }
              Copy-Item $_.FullName -Destination (Join-Path $releaseOut $assetName) -Force
            }

          $files = Get-ChildItem $releaseOut -File | ForEach-Object { $_.FullName }

          if ($files.Count -eq 0) {
            throw "No release files found under $env:CHANNEL_DIR"
          }

          gh release upload $tag @files --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload GitHub Release assets for $env:BRAND" }

          Write-Host "Uploaded $env:BRAND release assets to https://github.com/$repo/releases/tag/$tag"

      - name: Configure SSH for Linux upload
        env:
          SECRET_LINUX_DEPLOY_HOST: ${{ secrets.LINUX_DEPLOY_HOST }}
          SECRET_LINUX_DEPLOY_PORT: ${{ secrets.LINUX_DEPLOY_PORT }}
          SECRET_LINUX_DEPLOY_USER: ${{ secrets.LINUX_DEPLOY_USER }}
          VAR_LINUX_DEPLOY_HOST: ${{ vars.LINUX_DEPLOY_HOST }}
          VAR_LINUX_DEPLOY_PORT: ${{ vars.LINUX_DEPLOY_PORT }}
          VAR_LINUX_DEPLOY_USER: ${{ vars.LINUX_DEPLOY_USER }}
          LINUX_DEPLOY_KEY: ${{ secrets.LINUX_DEPLOY_KEY }}
          LINUX_DEPLOY_KNOWN_HOSTS: ${{ secrets.LINUX_DEPLOY_KNOWN_HOSTS }}
          SECRET_LINUX_DEPLOY_PATH: ${{ secrets.LINUX_DEPLOY_PATH }}
          VAR_LINUX_DEPLOY_PATH: ${{ vars.LINUX_DEPLOY_PATH }}
          INPUT_REMOTE_PATH: ${{ inputs.remote_path }}
        shell: pwsh
        run: |
          $deployHost = if ([string]::IsNullOrWhiteSpace($env:SECRET_LINUX_DEPLOY_HOST)) { $env:VAR_LINUX_DEPLOY_HOST } else { $env:SECRET_LINUX_DEPLOY_HOST }
          $deployPort = if ([string]::IsNullOrWhiteSpace($env:SECRET_LINUX_DEPLOY_PORT)) { $env:VAR_LINUX_DEPLOY_PORT } else { $env:SECRET_LINUX_DEPLOY_PORT }
          $deployUser = if ([string]::IsNullOrWhiteSpace($env:SECRET_LINUX_DEPLOY_USER)) { $env:VAR_LINUX_DEPLOY_USER } else { $env:SECRET_LINUX_DEPLOY_USER }
          $configuredRemotePath = if ([string]::IsNullOrWhiteSpace($env:SECRET_LINUX_DEPLOY_PATH)) { $env:VAR_LINUX_DEPLOY_PATH } else { $env:SECRET_LINUX_DEPLOY_PATH }

          if ([string]::IsNullOrWhiteSpace($deployHost)) { $deployHost = '43.224.248.112' }
          if ([string]::IsNullOrWhiteSpace($deployUser)) { $deployUser = 'root' }

          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:LINUX_DEPLOY_KEY)) { $missing += 'secrets.LINUX_DEPLOY_KEY' }
          if ([string]::IsNullOrWhiteSpace($env:INPUT_REMOTE_PATH) -and [string]::IsNullOrWhiteSpace($configuredRemotePath)) {
            $missing += 'workflow input remote_path, secrets.LINUX_DEPLOY_PATH, or vars.LINUX_DEPLOY_PATH'
          }
          if ($missing.Count -gt 0) {
            throw "Missing Linux upload configuration: $($missing -join ', ')"
          }

          $port = if ([string]::IsNullOrWhiteSpace($deployPort)) { '22' } else { $deployPort }
          $remotePath = if ([string]::IsNullOrWhiteSpace($env:INPUT_REMOTE_PATH)) { $configuredRemotePath } else { $env:INPUT_REMOTE_PATH }
          $remotePath = $remotePath.TrimEnd('/')

          $sshDir = Join-Path $HOME '.ssh'
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null

          $keyPath = Join-Path $sshDir 'linux_deploy_key'
          ($env:LINUX_DEPLOY_KEY -replace "`r`n", "`n") | Set-Content -Path $keyPath -NoNewline -Encoding ascii
          chmod 600 $keyPath

          $knownHostsPath = Join-Path $sshDir 'known_hosts'
          if ([string]::IsNullOrWhiteSpace($env:LINUX_DEPLOY_KNOWN_HOSTS)) {
            New-Item -ItemType File -Force -Path $knownHostsPath | Out-Null
            $strictHostKeyChecking = 'accept-new'
          } else {
            ($env:LINUX_DEPLOY_KNOWN_HOSTS -replace "`r`n", "`n") | Set-Content -Path $knownHostsPath -NoNewline -Encoding ascii
            $strictHostKeyChecking = 'yes'
          }

          "SSH_KEY_PATH=$keyPath" >> $env:GITHUB_ENV
          "SSH_KNOWN_HOSTS_PATH=$knownHostsPath" >> $env:GITHUB_ENV
          "SSH_STRICT_HOST_KEY_CHECKING=$strictHostKeyChecking" >> $env:GITHUB_ENV
          "LINUX_DEPLOY_HOST=$deployHost" >> $env:GITHUB_ENV
          "LINUX_DEPLOY_PORT=$port" >> $env:GITHUB_ENV
          "LINUX_DEPLOY_USER=$deployUser" >> $env:GITHUB_ENV
          "LINUX_DEPLOY_REMOTE_PATH=$remotePath" >> $env:GITHUB_ENV

      - name: Upload package to Linux server
        env:
          BRAND: ${{ matrix.brand }}
          CHANNEL: ${{ steps.upload_payload.outputs.channel }}
          VERSION: ${{ steps.upload_payload.outputs.version }}
          CHANNEL_DIR: ${{ steps.upload_payload.outputs.channel_dir }}
          ARCHIVE_DIR: ${{ steps.upload_payload.outputs.archive_dir }}
        shell: pwsh
        run: ./.github/scripts/upload-release-to-linux.ps1

      - name: Upload macOS DMG Packages
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.brand }}
          path: release/${{ matrix.brand }}/*-mac-*.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Upload macOS ZIP Packages
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip-${{ matrix.brand }}
          path: release/${{ matrix.brand }}/*-mac-*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload macOS Blockmap Files
        uses: actions/upload-artifact@v4
        with:
          name: macos-blockmap-${{ matrix.brand }}
          path: release/${{ matrix.brand }}/*.blockmap
          if-no-files-found: warn
          retention-days: 7

      - name: Upload macOS Update Manifests
        uses: actions/upload-artifact@v4
        with:
          name: macos-update-manifests-${{ matrix.brand }}
          path: |
            release/${{ matrix.brand }}/*.yml
            !release/${{ matrix.brand }}/builder-debug.yml
          if-no-files-found: warn
          retention-days: 7
